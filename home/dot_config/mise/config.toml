"github:babarot/gomi" = "v1.10.1"
"github:gfazioli/octoscope" = "v0.39.0"
"github:hayatosc/git-cx" = "0.2.0"
"github:microsoft/apm" = "v0.35.0"
"github:mizchi/actrun" = "v0.32.0"
"github:steipete/gogcli" = "v0.47.1"
"github:zenbu-labs/terminal-browser" = "v0.15.3"
go = "1.27.3"
"go:golang.org/x/tools/gopls" = "v0.24.0"
imagemagick = "7.1.2_25"
jq = "1.8.2"
lazygit = "0.66.2"
moonbit = "0.10.7+bc794d341"
ni = "30.6.0"
node = "24.21.0"
"npm:agent-browser" = "0.41.2"
"npm:acpx" = "0.21.1"
"npm:@xai-official/grok" = "1.0.74"
"npm:bash-language-server" = "5.8.1"
# TypeScript 7 provides the native LSP via `tsc --lsp --stdio`.
"npm:typescript" = "7.0.2"
"npm:vscode-langservers-extracted" = "4.10.0"
"npm:yaml-language-server" = "1.25.0"
"npm:@opencode/cli" = { version = "2.2.5", postinstall = "node $MISE_TOOL_INSTALL_PATH/node_modules/@opencode/cli/postinstall.mjs" }
pnpm = "12.16.1"
portless = "0.15.12"
python = "3.15.2"
resvg = "0.49.0"
ripgrep = "15.2.0"
rtk = "v0.52.0"
rust = "1.99.1"
rust-analyzer = "2026-05-25"
starship = "1.27.0"
taplo = "0.10.0"
tmux = "3.6b"
ttyd = "1.7.7"
ty = "0.0.97"
uv = "0.13.6"
yarn = "4.18.1"
yazi = { version = "26.9.1", postinstall = "ya pkg install" }
zig = "0.16.0"
zoxide = "0.10.0"
"github:herdrdev/herdr" = "v0.9.5"
sd = "1.1.0"
shellcheck = "0.11.0"
1password = "2.41.0"
pi = "latest"

[tools."http:moshi"]
version = "0.4.43"
postinstall = "ln -sfn $MISE_TOOL_INSTALL_PATH/moshi-hook $MISE_TOOL_INSTALL_PATH/moshi && ln -sfn $MISE_TOOL_INSTALL_PATH $(dirname $MISE_TOOL_INSTALL_PATH)/latest"
version_list_url = "https://cdn.getmoshi.app/hook/latest/version.txt"
version_regex = 'v?(\d+\.\d+\.\d+)'
checksum_url = "https://cdn.getmoshi.app/hook/v{{ version }}/checksums.txt"

[tools."http:moshi".platforms]
linux-x64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Linux_x86_64.tar.gz" }
linux-arm64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Linux_arm64.tar.gz" }
macos-x64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Darwin_x86_64.tar.gz" }
macos-arm64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Darwin_arm64.tar.gz" }

[settings]
experimental = true
lockfile = true
minimum_release_age = "3d"
aqua.registry_cache_ttl = "1d"
fetch_remote_versions_timeout = "30s"

[env]
AUBE_ALLOWED_UNPOPULAR_PACKAGES = "acpx,portless"
EDITOR = "hx"
VISUAL = "hx"

[hooks]
postinstall = ""

[tasks.sync-codex]
description = "sync config.toml on .codex folder"
run = "bun ~/.config/zsh/scripts/codex-sync-config.ts"

[tasks.sync-antigravity]
description = "sync settings.json on .gemini/antigravity-cli folder"
run = "bun ~/.config/zsh/scripts/antigravity-sync-config.ts"
