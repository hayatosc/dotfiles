claude = "2.1.318"
cloudflared = "2026.10.7"
codex = "0.166.0"
"conda:ffmpeg" = "8.1.1"
copilot = "v1.0.105"
delta = "0.20.1"
deno = "2.9.8"
fd = "10.5.1"
fzf = "0.74.5"
gcloud = "570.0.0"
