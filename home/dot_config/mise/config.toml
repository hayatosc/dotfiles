[tools."http:moshi"]
version = "0.4.56"
postinstall = "ln -sfn $MISE_TOOL_INSTALL_PATH/moshi-hook $MISE_TOOL_INSTALL_PATH/moshi && ln -sfn $MISE_TOOL_INSTALL_PATH $(dirname $MISE_TOOL_INSTALL_PATH)/latest"
version_list_url = "https://cdn.getmoshi.app/hook/latest/version.txt"
version_regex = 'v?(\d+\.\d+\.\d+)'
checksum_url = "https://cdn.getmoshi.app/hook/v{{ version }}/checksums.txt"

[tools."http:moshi".platforms]
linux-x64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Linux_x86_64.tar.gz" }
linux-arm64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Linux_arm64.tar.gz" }
macos-x64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Darwin_x86_64.tar.gz" }
macos-arm64 = { url = "https://cdn.getmoshi.app/hook/v{{ version }}/moshi-hook_Darwin_arm64.tar.gz" }

[tools."http:moonbit"]
version = "0.10.20+65efd5b93"
bin_path = "bin"
postinstall = """
find "$MISE_TOOL_INSTALL_PATH/bin" -type f -exec chmod +x {} +
ln -sfn moon "$MISE_TOOL_INSTALL_PATH/bin/moonx"
mkdir -p "$MISE_TOOL_INSTALL_PATH/lib"
rm -rf "$MISE_TOOL_INSTALL_PATH/lib/core"
ver_encoded=$(printf '%s' "$MISE_TOOL_VERSION" | sed 's/+/%2B/g')
curl -fsSL "https://cli.moonbitlang.com/cores/core-${ver_encoded}.tar.gz" | tar -xz -C "$MISE_TOOL_INSTALL_PATH/lib"
PATH="$MISE_TOOL_INSTALL_PATH/bin:$PATH" "$MISE_TOOL_INSTALL_PATH/bin/moon" -C "$MISE_TOOL_INSTALL_PATH/lib/core" bundle --warn-list -a --all
PATH="$MISE_TOOL_INSTALL_PATH/bin:$PATH" "$MISE_TOOL_INSTALL_PATH/bin/moon" -C "$MISE_TOOL_INSTALL_PATH/lib/core" bundle --warn-list -a --target wasm-gc --quiet
"""

[tools."http:moonbit".platforms]
linux-x64 = { url = "https://cli.moonbitlang.com/binaries/{{ version | replace(from=\"+\", to=\"%2B\") }}/moonbit-linux-x86_64.tar.gz" }
linux-arm64 = { url = "https://cli.moonbitlang.com/binaries/{{ version | replace(from=\"+\", to=\"%2B\") }}/moonbit-linux-aarch64.tar.gz" }
macos-arm64 = { url = "https://cli.moonbitlang.com/binaries/{{ version | replace(from=\"+\", to=\"%2B\") }}/moonbit-darwin-aarch64.tar.gz" }
windows-x64 = { url = "https://cli.moonbitlang.com/binaries/{{ version | replace(from=\"+\", to=\"%2B\") }}/moonbit-windows-x86_64.zip" }

[settings]
experimental = true
lockfile = true
minimum_release_age = "3d"
aqua.registry_cache_ttl = "1d"
fetch_remote_versions_timeout = "30s"

[env]
AUBE_ALLOWED_UNPOPULAR_PACKAGES = "acpx,portless"
EDITOR = "hx"
VISUAL = "hx"

[hooks]
postinstall = ""

[tasks.sync-codex]
description = "sync config.toml on .codex folder"
run = "bun ~/.config/zsh/scripts/codex-sync-config.ts"

[tasks.sync-antigravity]
description = "sync settings.json on .gemini/antigravity-cli folder"
run = "bun ~/.config/zsh/scripts/antigravity-sync-config.ts"
