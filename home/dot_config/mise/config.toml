[tools]
"aqua:eza-community/eza" = "0.23.5"
"aqua:google-antigravity/antigravity-cli" = "1.1.10"
"aqua:k1LoW/git-wt" = "0.29.0"
"aqua:micro-editor/micro" = "2.0.15"
"aqua:rossmacarthur/sheldon" = "0.8.5"
ast-grep = "0.44.1"
aube = "v1.37.0"
bat = "0.26.1"
bun = "1.3.14"
claude = "2.1.221"
cloudflared = "2026.7.3"
codex = "0.144.1"
"conda:ffmpeg" = "8.1.1"
copilot = "v1.0.78"
cursor-agent = "latest"
delta = "0.19.2"
deno = "2.9.4"
fd = "10.4.2"
fzf = "0.74.2"
gcloud = "570.0.0"
gh = "2.97.0"
ghq = "1.10.1"
"github:babarot/gomi" = "v1.6.4"
"github:gfazioli/octoscope" = "v0.26.0"
"github:hayatosc/git-cx" = "0.2.0"
"github:microsoft/apm" = "v0.27.0"
"github:mizchi/actrun" = "0.29.0"
"github:steipete/gogcli" = "v0.34.1"
go = "1.26.5"
"go:golang.org/x/tools/gopls" = "v0.23.0"
imagemagick = "7.1.2_18"
jq = "1.8.2"
lazygit = "0.63.1"
moonbit = "latest"
ni = "30.3.0"
node = "24.18.1"
"npm:agent-browser" = "0.33.2"
"npm:acpx" = "0.13.0"
"npm:@xai-official/grok" = "0.2.120"
"npm:typescript-language-server" = "5.3.0"
opencode = "1.18.11"
pnpm = "11.18.0"
portless = "0.15.5"
python = "3.14.6"
resvg = "0.47.0"
ripgrep = "15.2.0"
rtk = "v0.44.2"
rust = "1.97.1"
rust-analyzer = "2026-05-25"
starship = "1.26.0"
tmux = "3.6b"
ttyd = "1.7.7"
uv = "0.11.32"
yarn = "4.17.1"
yazi = { version = "26.5.6", postinstall = "ya pkg install" }
zig = "0.16.0"
zoxide = "0.10.0"
"github:herdrdev/herdr" = "v0.8.0"

[settings]
experimental = true
lockfile = true
minimum_release_age = "3d"
aqua.registry_cache_ttl = "1d"

[env]
AUBE_ALLOWED_UNPOPULAR_PACKAGES = "acpx,portless"

[hooks]
postinstall = ""

[tasks.sync-codex]
description = "sync config.toml on .codex folder"
run = "bun ~/.config/zsh/scripts/codex-sync-config.ts"

[tasks.sync-antigravity]
description = "sync settings.json on .gemini/antigravity-cli folder"
run = "bun ~/.config/zsh/scripts/antigravity-sync-config.ts"
