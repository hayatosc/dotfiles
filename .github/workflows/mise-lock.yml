name: Update mise.lock

# Mend ホスト型 Renovate は mise config を trust できず `mise lock` が失敗するため
# (renovate.json5 参照)、lockfile の更新はこのワークフローが肩代わりする。
# Renovate が config.toml を更新したブランチへ push されると、mise.lock を再生成して
# GitHub App トークンで PR ブランチへ直接コミットする。App コミットは GITHUB_TOKEN と
# 違い後続ワークフロー (mise-check) を再トリガーするので automerge の gate が再評価される。

on:
  push:
    branches-ignore:
      - main
    paths:
      - home/dot_config/mise/config.toml
      - .github/workflows/mise-lock.yml
      - .github/scripts/commit-via-graphql.ts
      - .github/scripts/validate-mise-lock.ts

permissions:
  contents: write
  pull-requests: write

# ブランチごとではなく全体で直列化する。並列に走ると各ジョブが mise の
# バージョン解決で GitHub API を大量消費し、App installation のレート制限
# (5000/h) を数分で使い切って後続の lock 再生成 / install check が連鎖的に
# 失敗するため (2026-08-22 に実際に発生)。lock ジョブは短時間なので
# 直列でも十分に速い。
concurrency:
  group: mise-lock
  cancel-in-progress: false

jobs:
  update-mise-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          install: false
          cache: true
          # 新しめの mise は lock 解決時に platform entry を大量に skip する
          # (2026.8.10 では 666 中 315 のみ書き込み)。lockfile 生成を決定論的に
          # 保つため、完全解決を確認済みの版に固定する。
          version: 2026.8.9

      - name: Regenerate and commit mise.lock via GraphQL
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          FILES: home/dot_config/mise/mise.lock
          MESSAGE: "chore(mise): update mise.lock"
          REGENERATE_CMD: |
            set -o pipefail
            cd home/dot_config/mise
            rm -f mise.lock
            mise lock 2>&1 | tee /tmp/mise-lock.log || exit 1
            # mise は解決に一部失敗しても exit 0 のため、レート制限等の警告が
            # ある場合は壊れた lockfile をコミットさせないために落とす。
            grep -qiE 'rate limit exceeded|client error \(403|failed to fetch' /tmp/mise-lock.log && {
              echo "incomplete resolution detected; refusing to commit" >&2
              exit 1
            }
            cd - >/dev/null
            mise exec bun -- bun .github/scripts/validate-mise-lock.ts home/dot_config/mise/mise.lock
        run: mise exec bun -- bun .github/scripts/commit-via-graphql.ts
