name: Codex cloud installer

on:
  pull_request:
    paths:
      - scripts/install-codex-cloud.sh
      - tests/test_codex_cloud.py
      - cloud/**
      - skills/**
      - .github/workflows/codex-cloud.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Shell syntax and isolated behavior tests
        run: |
          sh -n scripts/install-codex-cloud.sh
          python3 -m unittest discover -s tests -v
      - name: Real APM install and rerun in a disposable HOME
        shell: bash
        run: |
          set -euo pipefail
          work=$(mktemp -d)
          trap 'rm -rf -- "$work"' EXIT
          export HOME="$work/home with spaces"
          export CODEX_HOME="$work/codex with spaces"
          export XDG_DATA_HOME="$work/data with spaces"
          mkdir -p "$HOME"
          sh scripts/install-codex-cloud.sh
          sh scripts/install-codex-cloud.sh
          test "$(find "$HOME/.agents/skills" -mindepth 1 -maxdepth 1 -type l | wc -l)" -eq 40
          test -f "$CODEX_HOME/config.toml"
          test -f "$CODEX_HOME/AGENTS.md"
