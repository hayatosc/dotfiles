name: mise install check

# Renovate が更新した mise ツールが実際にインストールできるか検証する。
# main ブランチ保護の required status check であり、GitHub の auto-merge
# (platformAutomerge) の gate にもなるため、paths フィルタを付けずに全 PR で
# 必ず実行する必要がある (変更ツールが無ければ即 success)。
# bot による mise.lock commit (App token) で synchronize 再実行されるので、
# lock 更新済みの head に対して判定が確定する。

on:
  pull_request: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-latest
    env:
      # chezmoi のソースパスにある mise 設定を global config として使わせる
      MISE_GLOBAL_CONFIG_FILE: ${{ github.workspace }}/home/dot_config/mise/config.toml
      MISE_EXPERIMENTAL: "1"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MISE_FETCH_REMOTE_VERSIONS_TIMEOUT: 30s
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
        with:
          install: false
          # lockfile を生成する mise-lock.yml と同じ版を使い、挙動を一致させる。
          version: 2026.11.14

      - name: Copy dot_mise to .mise
        run: |
          # mise refuses to read lockfile sidecars through a symlinked .mise, so
          # copy the directory the same way mise-lock.yml does.
          rm -rf home/dot_config/mise/.mise
          if [ -d home/dot_config/mise/dot_mise ]; then
            cp -a home/dot_config/mise/dot_mise home/dot_config/mise/.mise
          fi

      - name: Install changed tools
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          specs=$(mise exec bun -- bun .github/scripts/mise-changed-specs.ts)
          if [ -z "$specs" ]; then
            echo "変更されたツールなし。インストール検証はスキップします。"
            exit 0
          fi
          echo "変更されたツールをインストールして検証します:"
          echo "$specs"
          # aube と node は npm: バックエンド等の前提となるため一律で事前インストールする。
          # config.toml の lockfile = true により mise install 時に全ツールの lock 解決が
          # 自動実行されるのを防ぐため MISE_LOCKFILE=0 で実行する。
          MISE_LOCKFILE=0 mise install aube node
          # go: tools (gopls, ...) declare go as an install dependency.
          if printf '%s\n' "$specs" | grep -q '^go:'; then
            MISE_LOCKFILE=0 mise install go
          fi

          mapfile -t tools < <(printf '%s\n' "$specs" | sed 's/@[^@]*$//')
          if ! mise install --locked "${tools[@]}"; then
            # vfox: 等のバックエンドは lockfile URL を生成できず locked モードが
            # 常に失敗する。検証目的はインストール可能性なので unlocked で再試行する。
            echo "locked install failed; retrying without --locked"
            MISE_LOCKFILE=0 mise install "${tools[@]}"
          fi
