name: dotfile-skills
version: 0.1.0
description: Agent skills managed via Microsoft APM. Self-authored skills live
  directly under skills/; external skills are pinned by apm.lock.yaml. The shared
  scripts/agent_skills.py stages and verifies both before publishing owned links
  under ~/.agents/skills/. Desktop chezmoi and the Codex cloud installer reuse it.
targets:
  - agent-skills
dependencies:
  apm:
    - anthropics/skills/skills/frontend-design
    - anthropics/skills/skills/skill-creator
    - vercel-labs/agent-skills/skills/web-design-guidelines
    - vercel-labs/agent-browser/skills/agent-browser
    - GoogleChrome/modern-web-guidance/skills/modern-web-guidance
    - openclaw/acpx/skills/acpx
    - emilkowalski/skill/skills/emil-design-eng
    - dominikmartn/nothing-design-skill/nothing-design
    - vuejs-ai/skills/skills/vue-best-practices
    - vercel-labs/skills/skills/find-skills
    - openai/skills/skills/.curated/gh-fix-ci
    - openai/skills/skills/.curated/gh-address-comments
    - moonbitlang/skills/skills/moonbit-agent-guide
    - nanaism/yomiyasu/skills/yomiyasu#8d5abeebe2dd20c2db005deaddcc50be43c59c0a
    - ogulcancelik/herdr
    - sveltejs/ai-tools/tools/skills/svelte-core-bestpractices
    - cloudflare/security-audit-skill/skills/security-audit
    - Nutlope/hallmark/skills/hallmark
    - github/gh-stack/skills/gh-stack
    - anthropics/skills/skills/pptx
    - warpdotdev/common-skills/.agents/skills/skill-doctor
